<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Volquetas</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f1f5f9;
      padding:15px;
    }

    .container{
      max-width:750px;
      margin:auto;
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    .header{
      background:#0f172a;
      color:white;
      padding:25px;
    }

    .header h1{
      font-size:28px;
      margin-bottom:5px;
    }

    .content{
      padding:20px;
    }

    .section-title{
      font-size:18px;
      font-weight:bold;
      color:#1e3a8a;
      margin:25px 0 15px;
      border-bottom:2px solid #e2e8f0;
      padding-bottom:8px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    @media(max-width:600px){
      .grid{
        grid-template-columns:1fr;
      }
    }

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:600;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:14px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      font-size:16px;
      background:white;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    .options{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .option-btn{
      border:1px solid #94a3b8;
      padding:12px 18px;
      border-radius:30px;
      cursor:pointer;
      transition:0.2s;
      user-select:none;
      background:white;
    }

    .option-btn input{
      display:none;
    }

    .option-btn.active{
      background:#2563eb;
      color:white;
      border-color:#2563eb;
    }

    .measurement-box{
      border:1px solid #cbd5e1;
      border-radius:15px;
      padding:15px;
      margin-bottom:12px;
    }

    .hidden{
      display:none;
    }

    .btn-submit{
      width:100%;
      background:#2563eb;
      color:white;
      border:none;
      padding:18px;
      border-radius:14px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      margin-top:20px;
    }

    .success{
      background:#dcfce7;
      color:#166534;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
      display:none;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>Registro de Volquetas</h1>
  </div>

  <div class="content">

    <div class="success" id="successMsg">
      Registro enviado correctamente.
    </div>

    <form id="registroForm">

      <div class="section-title">
        Datos Generales
      </div>

      <div class="grid">

        <div class="field">
          <label>Placa</label>

          <select name="placa" required>
            <option value="">Seleccione una placa</option>
            <option value="USE-259">USE-259</option>
            <option value="STS-405">STS-405</option>
          </select>

        </div>

        <div class="field">
          <label>Fecha</label>
          <input type="date" name="fecha" required>
        </div>

      </div>

      <div class="field">
        <label>Número de Vale</label>
        <input type="text" name="numeroVale" required>
      </div>

      <div class="field">
        <label>Foto del Vale</label>
        <input type="file" name="fotoVale" accept="image/*">
      </div>

      <div class="section-title">
        Actividad
      </div>

      <div class="options">

        <label class="option-btn actividad-btn">
          <input type="radio" name="actividad" value="Cargue" required>
          Cargue
        </label>

        <label class="option-btn actividad-btn">
          <input type="radio" name="actividad" value="Mantenimiento">
          Mantenimiento
        </label>

        <label class="option-btn actividad-btn">
          <input type="radio" name="actividad" value="Stand By">
          Stand By
        </label>

        <label class="option-btn actividad-btn">
          <input type="radio" name="actividad" value="Varada">
          Varada
        </label>

      </div>

      <div class="section-title">
        Tipo de Medición
      </div>

      <div class="measurement-box">

        <label>
          <input type="checkbox" id="checkCantidad">
          Cantidad m³
        </label>

        <div id="cantidadBox" class="hidden">
          <input type="number" step="0.01" name="cantidadM3" placeholder="Ingrese cantidad m³">
        </div>

      </div>

      <div class="measurement-box">

        <label>
          <input type="checkbox" id="checkKm">
          Kilometraje Inicial / Final
        </label>

        <div id="kmBox" class="hidden">

          <div class="grid">

            <input type="number" name="kmInicial" placeholder="KM Inicial">

            <input type="number" name="kmFinal" placeholder="KM Final">

          </div>

        </div>

      </div>

      <div class="measurement-box">

        <label>
          <input type="checkbox" id="checkOtro">
          Otro
        </label>

        <div id="otroBox" class="hidden">
          <input type="text" name="otroMedicion" placeholder="Escriba la medición">
        </div>

      </div>

      <div class="section-title">
        Tipo de Material
      </div>

      <div class="field">
        <input type="text" name="material" placeholder="Escriba el tipo de material">
      </div>

      <div class="field">
        <label>Observaciones</label>
        <textarea name="observaciones"></textarea>
      </div>

      <button type="submit" class="btn-submit">
        Enviar Registro
      </button>

    </form>

  </div>

</div>

<script>

  const actividadButtons = document.querySelectorAll(".actividad-btn");

  actividadButtons.forEach(btn => {

    btn.addEventListener("click", () => {

      actividadButtons.forEach(b => b.classList.remove("active"));

      btn.classList.add("active");

    });

  });

  const checkCantidad = document.getElementById("checkCantidad");
  const checkKm = document.getElementById("checkKm");
  const checkOtro = document.getElementById("checkOtro");

  const cantidadBox = document.getElementById("cantidadBox");
  const kmBox = document.getElementById("kmBox");
  const otroBox = document.getElementById("otroBox");

  checkCantidad.addEventListener("change", () => {
    cantidadBox.classList.toggle("hidden");
  });

  checkKm.addEventListener("change", () => {
    kmBox.classList.toggle("hidden");
  });

  checkOtro.addEventListener("change", () => {
    otroBox.classList.toggle("hidden");
  });

  const form = document.getElementById("registroForm");

  form.addEventListener("submit", async function(e){

    e.preventDefault();

    const button = document.querySelector(".btn-submit");

    button.innerText = "Enviando...";
    button.disabled = true;

    const foto = form.fotoVale.files[0];

    let base64 = "";

    if(foto){

      base64 = await convertirBase64(foto);

    }

    const data = {

      placa: form.placa.value,
      fecha: form.fecha.value,
      numeroVale: form.numeroVale.value,
      actividad: form.actividad.value,
      cantidadM3: form.cantidadM3.value,
      kmInicial: form.kmInicial.value,
      kmFinal: form.kmFinal.value,
      otroMedicion: form.otroMedicion.value,
      material: form.material.value,
      observaciones: form.observaciones.value,
      foto: base64,
      nombreFoto: foto ? foto.name : ""

    };

    try {

      await fetch("https://script.google.com/macros/s/AKfycbzV64TtCkDVuzXxlEgekLK8zgytFt36UeZ4UI0EP9hoPLnDnRtpFbUPK1zs-C0tcuzS/exec", {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

      });

      document.getElementById("successMsg").style.display = "block";

      form.reset();

      actividadButtons.forEach(b => b.classList.remove("active"));

      cantidadBox.classList.add("hidden");
      kmBox.classList.add("hidden");
      otroBox.classList.add("hidden");

    } catch(error){

      alert("Error enviando datos");

    }

    button.innerText = "Enviar Registro";
    button.disabled = false;

  });

  function convertirBase64(file){

    return new Promise((resolve, reject) => {

      const reader = new FileReader();

      reader.readAsDataURL(file);

      reader.onload = () => resolve(reader.result);

      reader.onerror = error => reject(error);

    });

  }

</script>

</body>
</html>
